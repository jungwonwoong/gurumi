<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="author" content="Sean Bradley" />
        <title>Car Physics</title>
        <meta name="description" content="Three.js TypeScript Tutorials by Sean Bradley : https://sbcode.net/threejs" />
        <script type="importmap">
            {
                "imports": {
                    "three": "./node_modules/three/build/three.module.js",
                    "three/addons/": "./node_modules/three/examples/jsm/",
                    "dat.gui": "./node_modules/dat.gui/build/dat.gui.module.js",
                    "cannon-es": "./node_modules/cannon-es/dist/cannon-es.js"
                }
            }
        </script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="instructions">W,A,S,D or Arrow Keys to Drive. Space to brake. Drag to look around. Scroll to zoom.</div>
        <div id="camera-preview" aria-label="구루미 정면 카메라 화면">
            <canvas id="camera-preview-canvas"></canvas>
            <span id="camera-preview-label">구루미 카메라</span>
        </div>
        <aside id="obstacle-menu">
            <h2>장애물 추가</h2>
            <div id="obstacle-shapes" aria-label="장애물 모양">
                <button class="obstacle-template" type="button" data-shape="box">직육면체</button>
                <button class="obstacle-template" type="button" data-shape="sphere">구</button>
                <button class="obstacle-template" type="button" data-shape="cylinder">실린더</button>
            </div>
<div id="obstacle-size-controls" aria-label="장애물 크기 조절">
                <div class="obstacle-size-group" data-shape="box">
                    <label class="obstacle-size-control"><span>X</span><input id="obstacle-size-x" type="range" min="0.05" step="0.05" value="0.6" aria-label="직육면체 X 크기" /><output id="obstacle-size-x-value">0.60</output></label>
                    <label class="obstacle-size-control"><span>Y</span><input id="obstacle-size-y" type="range" min="0.05" step="0.05" value="0.2" aria-label="직육면체 Y 크기" /><output id="obstacle-size-y-value">0.20</output></label>
                    <label class="obstacle-size-control"><span>Z</span><input id="obstacle-size-z" type="range" min="0.05" step="0.05" value="0.6" aria-label="직육면체 Z 크기" /><output id="obstacle-size-z-value">0.60</output></label>
                </div>
                <div class="obstacle-size-group" data-shape="sphere" hidden>
                    <label class="obstacle-size-control"><span>반지름</span><input id="obstacle-size-sphere-radius" type="range" min="0.05" step="0.05" value="0.3" aria-label="구 반지름" /><output id="obstacle-size-sphere-radius-value">0.30</output></label>
                </div>
                <div class="obstacle-size-group" data-shape="cylinder" hidden>
                    <label class="obstacle-size-control"><span>반지름</span><input id="obstacle-size-cylinder-radius" type="range" min="0.05" step="0.05" value="0.3" aria-label="실린더 반지름" /><output id="obstacle-size-cylinder-radius-value">0.30</output></label>
                    <label class="obstacle-size-control"><span>높이</span><input id="obstacle-size-cylinder-height" type="range" min="0.05" step="0.05" value="0.6" aria-label="실린더 높이" /><output id="obstacle-size-cylinder-height-value">0.60</output></label>
                </div>
                <!-- 마찰계수 조절 슬라이더 추가 -->
                <div id="obstacle-friction-group" aria-label="장애물 마찰계수 조절" style="margin-top: 10px;">
                    <label class="obstacle-size-control"><span>마찰</span><input id="obstacle-friction" type="range" min="0" max="1" step="0.05" value="0.3" aria-label="마찰계수" /><output id="obstacle-friction-value">0.30</output></label>
                </div>
            </div>
            <p>크기는 계단 높이의 최대 5배까지입니다.<br />장애물 모양 버튼을 클릭해 선택하세요. Ctrl을 누른 상태에서 장면을 마우스로 누르고 드래그한 뒤 놓으면 설치됩니다. Ctrl을 계속 누르고 반복하면 연속 설치할 수 있습니다. Shift를 누른 채 설치한 장애물을 클릭하면 삭제합니다. 휠로 회전할 수 있습니다.</p>
        </aside>
        <div id="mobile-joystick" role="application" aria-label="이동 조이스틱">
            <div id="mobile-joystick-knob"></div>
        </div>
        <button id="reset-car" type="button">자세 리셋</button>
        <script type="module" src="./simulation.js"></script>
    </body>
</html>
